<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111817">
  <meta name="description" content="A route planner and trophy dossiers for Grand Theft Auto VI on PlayStation 5.">
  <title>Trophy Atlas — Grand Theft Auto VI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="#route" aria-label="Trophy Atlas home"><span class="mark">TA</span><span>Trophy Atlas</span></a>
    <p class="platform-note">GRAND THEFT AUTO VI <span>·</span> PLAYSTATION 5</p>
    <div class="overall" aria-label="Overall progress">
      <span id="earned-count">0 / 55</span>
      <span class="overall-bar"><i id="overall-fill"></i></span>
      <span id="remaining-time">time left —</span>
    </div>
    <nav class="view-nav" aria-label="Guide views">
      <a href="#route" id="route-tab">Route</a>
      <a href="#trophies" id="trophies-tab">Trophies</a>
    </nav>
    <div class="tools">
      <label class="spoiler-control"><input id="spoilers" type="checkbox"><span>Spoilers</span></label>
      <button id="export" type="button">Export</button>
      <button id="import" type="button">Import</button>
      <button id="reset" type="button">Reset</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <div id="notice" role="status" aria-live="polite"></div>
  <noscript>This route atlas needs JavaScript enabled to display its guide.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>

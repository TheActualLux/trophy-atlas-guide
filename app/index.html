<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101816">
  <meta name="description" content="An offline route and trophy dossier for Grand Theft Auto VI.">
  <title>Leonida Trophy Atlas</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#route"><span class="brand-mark">LA</span><span>Leonida Atlas</span></a>
    <span class="edition">GTA VI <i>·</i> PLAYSTATION 5</span>
    <div class="total-progress" aria-label="Trophy progress"><b id="earned-count">0 / 55</b><span class="total-track"><i id="overall-fill"></i></span><span id="remaining-time">— hours left</span></div>
    <nav class="main-nav" aria-label="Main views"><a href="#route" id="route-tab">Route</a><a href="#trophies" id="trophies-tab">Trophies</a></nav>
    <div class="actions">
      <label class="spoiler-setting"><input type="checkbox" id="spoilers"><span>Spoilers</span></label>
      <button type="button" id="export">Export</button><button type="button" id="import">Import</button><button type="button" id="reset">Reset</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <output id="notice" aria-live="polite" aria-atomic="true"></output>
  <noscript>This guide requires JavaScript to show its route and dossiers.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
